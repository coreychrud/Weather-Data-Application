[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-data-application"
version = "0.1.0"
description = "A FastAPI service for retrieving forecasts from Open-Meteo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.37,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

